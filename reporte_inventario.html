<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Movimientos de Inventario | InvenSaaS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/reporte_inventario.css">
    <script src="js/config.js"></script>
</head>

<body>
    <div class="container">
        <!-- ============================================
        HEADER
        ============================================ -->
        <div class="page-header">
            <h1><i class="fas fa-boxes"></i> Reporte de Movimientos de Inventario</h1>
            <a href="inventario_dashboard.html" class="btn-back">
                <i class="fas fa-arrow-left"></i> Volver al Panel Principal
            </a>
        </div>

        <!-- ============================================
        FILTROS
        ============================================ -->
        <div class="filters">
            <div class="group">
                <label><i class="fas fa-filter"></i> Tipo de Movimiento</label>
                <select id="tipo-movimiento">
                    <option value="TODOS">TODOS</option>
                    <option value="ENTRADA">ENTRADA</option>
                    <option value="SALIDA">SALIDA</option>
                    <option value="AJUSTE">AJUSTE</option>
                </select>
            </div>
            <div class="group">
                <label><i class="fas fa-calendar-alt"></i> Fecha Inicial</label>
                <input type="date" id="fecha-inicio">
            </div>
            <div class="group">
                <label><i class="fas fa-calendar-alt"></i> Fecha Final</label>
                <input type="date" id="fecha-fin">
            </div>
            <div class="group">
                <label><i class="fas fa-search"></i> Buscar Producto</label>
                <input type="text" id="buscar-producto" placeholder="Nombre del producto...">
            </div>
            <div class="actions">
                <button class="btn btn-execute" id="btn-ejecutar"><i class="fas fa-play"></i> Ejecutar</button>
                <button class="btn btn-refresh" id="btn-recargar"><i class="fas fa-sync-alt"></i> Recargar</button>
                <div class="dropdown" style="display:inline-block; position:relative;">
                    <button class="btn btn-export" id="btn-exportar">
                        <i class="fas fa-file-export"></i> Exportar ▼
                    </button>
                    <div class="dropdown-content"
                        style="display:none; position:absolute; background:white; min-width:160px; box-shadow:0 8px 16px rgba(0,0,0,0.1); border-radius:8px; z-index:10; margin-top:4px;">
                        <button onclick="exportarCSV()"
                            style="width:100%; padding:10px 16px; border:none; background:none; text-align:left; cursor:pointer; font-family:'Inter',sans-serif;">
                            <i class="fas fa-file-csv" style="color:#22c55e;"></i> CSV
                        </button>
                        <button onclick="exportarCSV()"
                            style="width:100%; padding:10px 16px; border:none; background:none; text-align:left; cursor:pointer; font-family:'Inter',sans-serif;">
                            <i class="fas fa-file-excel" style="color:#22c55e;"></i> Excel (CSV)
                        </button>
                        <button onclick="window.print()"
                            style="width:100%; padding:10px 16px; border:none; background:none; text-align:left; cursor:pointer; font-family:'Inter',sans-serif;">
                            <i class="fas fa-print" style="color:#3b82f6;"></i> Imprimir
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ============================================
        TABLA - CENTRO
        ============================================ -->
        <div class="table-card">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Fecha y Hora</th>
                            <th>Producto</th>
                            <th>Tipo</th>
                            <th style="text-align:center;">Cantidad</th>
                            <th style="text-align:center;">Stock Antes</th>
                            <th style="text-align:center;">Stock Después</th>
                            <th>Usuario</th>
                            <th>Referencia</th>
                        </tr>
                    </thead>
                    <tbody id="movimientos-tbody">
                        <tr>
                            <td colspan="8" class="empty"><i class="fas fa-spinner fa-spin"></i> Cargando movimientos...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- ============================================
        SUMMARY - ABAJO DE LA TABLA
        ============================================ -->
        <div class="summary">
            <div class="card">
                <div class="label"><i class="fas fa-arrow-down" style="color:var(--success);"></i> Entradas</div>
                <div class="value success" id="total-entradas">0.00</div>
                <small>unidades ingresadas</small>
            </div>
            <div class="card">
                <div class="label"><i class="fas fa-arrow-up" style="color:var(--danger);"></i> Salidas</div>
                <div class="value danger" id="total-salidas">0.00</div>
                <small>unidades vendidas</small>
            </div>
            <div class="card">
                <div class="label"><i class="fas fa-balance-scale" style="color:var(--primary);"></i> Balance Neto</div>
                <div class="value primary" id="balance-neto">0.00</div>
                <small>(Entradas − Salidas)</small>
            </div>
        </div>
    </div>

    <script>
        (function () {
            console.log('🚀 ===== REPORTE INVENTARIO INICIADO =====');

            const token = localStorage.getItem('token');
            const API_URL = window.API_URL || 'https://invensaas-backend.onrender.com/api';
            let todosLosMovimientos = [];

            console.log('🔑 Token:', token ? '✅ Sí' : '❌ No');
            console.log('🌐 API_URL:', API_URL);

            if (!token) {
                document.getElementById('movimientos-tbody').innerHTML =
                    '<tr><td colspan="8" class="empty">❌ Sesión no válida. <a href="login.html">Iniciar sesión</a></td></tr>';
                return;
            }

            const tbody = document.getElementById('movimientos-tbody');
            const totalEntradasEl = document.getElementById('total-entradas');
            const totalSalidasEl = document.getElementById('total-salidas');
            const balanceNetoEl = document.getElementById('balance-neto');

            function formatNumber(value) {
                const num = Number(value);
                return isNaN(num) ? '0.00' : num.toFixed(2);
            }

            function formatDate(dateStr) {
                if (!dateStr) return '—';
                try {
                    return new Date(dateStr).toLocaleString('es-NI', {
                        day: '2-digit', month: '2-digit', year: 'numeric',
                        hour: '2-digit', minute: '2-digit'
                    });
                } catch {
                    return dateStr;
                }
            }

            function renderMovimientos(movimientos) {
                if (!movimientos || movimientos.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" class="empty">📭 No hay movimientos que coincidan con los filtros.</td></tr>';
                    return;
                }

                let html = '';
                let totalEntradas = 0;
                let totalSalidas = 0;

                movimientos.forEach(m => {
                    const tipo = m.tipo || '';
                    const cantidad = Number(m.cantidad) || 0;
                    const stockAntes = Number(m.stock_antes) || 0;
                    const stockDespues = Number(m.stock_despues) || 0;

                    if (tipo === 'ENTRADA') totalEntradas += cantidad;
                    else if (tipo === 'SALIDA') totalSalidas += cantidad;

                    const color = tipo === 'ENTRADA' ? '#22c55e' : (tipo === 'SALIDA' ? '#ef4444' : '#f59e0b');
                    const icon = tipo === 'ENTRADA' ? '📥' : (tipo === 'SALIDA' ? '📤' : '⚡');

                    html += `
                        <tr>
                            <td>${formatDate(m.fecha)}</td>
                            <td><strong>${m.producto_nombre || 'Desconocido'}</strong></td>
                            <td style="color:${color}; font-weight:600;">${icon} ${tipo}</td>
                            <td style="text-align:center; font-weight:600;">${formatNumber(cantidad)}</td>
                            <td style="text-align:center;">${formatNumber(stockAntes)}</td>
                            <td style="text-align:center;">${formatNumber(stockDespues)}</td>
                            <td>${m.usuario_nombre || 'Sistema'}</td>
                            <td>${m.referencia || '—'}</td>
                        </tr>
                    `;
                });

                tbody.innerHTML = html;

                const balance = totalEntradas - totalSalidas;
                totalEntradasEl.textContent = formatNumber(totalEntradas);
                totalSalidasEl.textContent = formatNumber(totalSalidas);
                balanceNetoEl.textContent = formatNumber(balance);
                balanceNetoEl.style.color = balance > 0 ? '#22c55e' : (balance < 0 ? '#ef4444' : '#64748b');

                console.log('✅ Tabla renderizada con', movimientos.length, 'movimientos');
            }

            async function loadMovimientos() {
                console.log('🔄 Cargando movimientos...');
                tbody.innerHTML = '<tr><td colspan="8" class="empty"><i class="fas fa-spinner fa-spin"></i> Cargando...</td></tr>';

                try {
                    const response = await fetch(`${API_URL}/admin/inventario/movimientos`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });

                    console.log('📡 Status:', response.status);

                    if (response.status === 401) {
                        tbody.innerHTML = '<tr><td colspan="8" class="empty">❌ Sesión expirada. <a href="login.html">Iniciar sesión</a></td></tr>';
                        return;
                    }

                    const data = await response.json();
                    console.log('📦 Datos recibidos:', data);

                    if (!data.success || !data.movimientos) {
                        tbody.innerHTML = '<tr><td colspan="8" class="empty">❌ Error al cargar movimientos.</td></tr>';
                        return;
                    }

                    todosLosMovimientos = data.movimientos;
                    console.log('📊 Movimientos encontrados:', todosLosMovimientos.length);

                    aplicarFiltros();

                } catch (error) {
                    console.error('❌ Error:', error);
                    tbody.innerHTML = `<tr><td colspan="8" class="empty">❌ Error de conexión: ${error.message}</td></tr>`;
                }
            }

            // ============================================
            // EXPORTAR CSV
            // ============================================
            function exportarCSV() {
                const rows = tbody.querySelectorAll('tr');

                if (rows.length === 0 || rows[0].classList.contains('empty')) {
                    alert('⚠️ No hay datos para exportar.');
                    return;
                }

                const data = [];
                const headers = ['Fecha', 'Producto', 'Tipo', 'Cantidad', 'Stock Antes', 'Stock Después', 'Usuario', 'Referencia'];
                data.push(headers);

                rows.forEach(row => {
                    const cols = row.querySelectorAll('td');
                    if (cols.length > 0) {
                        const rowData = [];
                        cols.forEach(col => {
                            let text = col.textContent.trim();
                            text = text.replace(/[^\w\s\d.,$C\-]/g, '').trim();
                            rowData.push(text);
                        });
                        if (rowData.length === 8) {
                            data.push(rowData);
                        }
                    }
                });

                let csvContent = '';
                data.forEach(row => {
                    const escapedRow = row.map(cell => {
                        if (typeof cell === 'string' && (cell.includes(',') || cell.includes('"') || cell.includes('\n'))) {
                            return `"${cell.replace(/"/g, '""')}"`;
                        }
                        return cell;
                    });
                    csvContent += escapedRow.join(',') + '\n';
                });

                const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                const url = URL.createObjectURL(blob);
                link.setAttribute('href', url);

                const now = new Date();
                const fechaStr = now.toISOString().slice(0, 10);
                link.setAttribute('download', `movimientos_inventario_${fechaStr}.csv`);

                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);

                console.log('✅ CSV exportado correctamente');
            }

            // ============================================
            // FILTROS
            // ============================================
            function aplicarFiltros() {
                const tipo = document.getElementById('tipo-movimiento').value;
                const fechaInicio = document.getElementById('fecha-inicio').value;
                const fechaFin = document.getElementById('fecha-fin').value;
                const buscarProducto = document.getElementById('buscar-producto').value.toLowerCase().trim();

                console.log('🔍 Aplicando filtros:', { tipo, fechaInicio, fechaFin, buscarProducto });

                let filtrados = todosLosMovimientos;

                if (tipo !== 'TODOS') {
                    filtrados = filtrados.filter(m => m.tipo === tipo);
                }

                if (fechaInicio) {
                    const inicio = new Date(fechaInicio);
                    inicio.setHours(0, 0, 0, 0);
                    filtrados = filtrados.filter(m => new Date(m.fecha) >= inicio);
                }

                if (fechaFin) {
                    const fin = new Date(fechaFin);
                    fin.setHours(23, 59, 59, 999);
                    filtrados = filtrados.filter(m => new Date(m.fecha) <= fin);
                }

                if (buscarProducto) {
                    filtrados = filtrados.filter(m =>
                        (m.producto_nombre && m.producto_nombre.toLowerCase().includes(buscarProducto))
                    );
                }

                console.log('📊 Resultados filtrados:', filtrados.length);
                renderMovimientos(filtrados);
            }

            // ============================================
            // EVENTOS
            // ============================================
            document.getElementById('btn-ejecutar').addEventListener('click', aplicarFiltros);
            document.getElementById('btn-recargar').addEventListener('click', () => {
                document.getElementById('tipo-movimiento').value = 'TODOS';
                document.getElementById('fecha-inicio').value = '';
                document.getElementById('fecha-fin').value = '';
                document.getElementById('buscar-producto').value = '';
                loadMovimientos();
            });

            // ✅ CORREGIDO: El evento de exportar ya está bien
            document.getElementById('btn-exportar').addEventListener('click', function (e) {
                e.stopPropagation();
                // El dropdown se maneja con CSS
            });

            // Filtros automáticos
            document.getElementById('tipo-movimiento').addEventListener('change', aplicarFiltros);
            document.getElementById('fecha-inicio').addEventListener('change', aplicarFiltros);
            document.getElementById('fecha-fin').addEventListener('change', aplicarFiltros);
            document.getElementById('buscar-producto').addEventListener('input', aplicarFiltros);

            // ============================================
            // INICIAR
            // ============================================
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', loadMovimientos);
            } else {
                loadMovimientos();
            }

        })();
    </script>
</body>

</html>
