<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Registro de Empresa - InvenSaaS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="js/config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-gradient: linear-gradient(135deg, #6366f1, #8b5cf6);
            --text: #1e293b;
            --text-light: #64748b;
            --white: #ffffff;
            --light: #f1f5f9;
            --border: #e2e8f0;
            --success: #22c55e;
            --danger: #ef4444;
            --radius: 16px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 8px 32px rgba(99, 102, 241, 0.15);
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--light);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 520px;
            width: 100%;
            background: var(--white);
            border-radius: var(--radius);
            padding: 40px 32px;
            box-shadow: var(--shadow-hover);
            border: 1px solid var(--border);
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 28px;
            font-weight: 900;
            text-decoration: none;
            margin-bottom: 8px;
        }

        .header .logo .icon {
            width: 44px;
            height: 44px;
            background: var(--primary-gradient);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
        }

        .header .logo .text {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header .logo .text span {
            color: var(--text);
            -webkit-text-fill-color: var(--text);
        }

        .header h2 {
            font-size: 22px;
            font-weight: 800;
            margin-top: 4px;
        }

        .header p {
            color: var(--text-light);
            font-size: 14px;
            margin-top: 2px;
        }

        /* Mensaje de error */
        .error-message {
            display: none;
            background: #fee2e2;
            color: #dc2626;
            padding: 14px 16px;
            border-radius: 10px;
            border: 1px solid #fecaca;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
        }

        .error-message i {
            margin-right: 8px;
        }

        /* Formulario */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: var(--text);
            margin-bottom: 4px;
        }

        .form-group label .required {
            color: var(--danger);
            margin-left: 2px;
        }

        .form-group .input-wrapper {
            position: relative;
        }

        .form-group .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 16px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            transition: var(--transition);
            background: var(--light);
            color: var(--text);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.08);
        }

        .form-group input::placeholder {
            color: #94a3b8;
        }

        .form-group input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Botón */
        .btn-register {
            width: 100%;
            padding: 14px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
        }

        .btn-register:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.35);
        }

        .btn-register:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-register .spinner {
            display: none;
            animation: spin 1s linear infinite;
        }

        .btn-register.loading .spinner {
            display: inline-block;
        }

        .btn-register.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            font-size: 13px;
            color: var(--text-light);
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .footer a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        /* 🔥 RESPONSIVE */
        @media (max-width: 480px) {
            body {
                padding: 12px;
                align-items: flex-start;
                padding-top: 30px;
            }

            .container {
                padding: 24px 18px;
                border-radius: 12px;
            }

            .header .logo {
                font-size: 22px;
            }

            .header .logo .icon {
                width: 38px;
                height: 38px;
                font-size: 18px;
            }

            .header h2 {
                font-size: 20px;
            }

            .form-group input {
                padding: 10px 14px 10px 38px;
                font-size: 14px;
            }

            .form-group .input-wrapper i {
                left: 12px;
                font-size: 14px;
            }

            .btn-register {
                padding: 12px;
                font-size: 15px;
            }

            .footer {
                font-size: 12px;
            }
        }

        @media (max-width: 380px) {
            .container {
                padding: 18px 14px;
            }

            .header h2 {
                font-size: 18px;
            }

            .form-group input {
                font-size: 13px;
                padding: 8px 12px 8px 34px;
            }
        }

        /* Scroll suave para toda la página */
        html {
            scroll-behavior: smooth;
        }

        /* Para dispositivos táctiles, mejorar el tamaño de los inputs */
        input {
            font-size: 16px !important; /* Evita zoom en iOS */
        }

        /* Ocultar flechas de input number */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <a href="index.html" class="logo">
                <div class="icon"><i class="fas fa-cubes"></i></div>
                <div class="text">Inven<span>SaaS</span></div>
            </a>
            <h2>Registrar Nueva Empresa</h2>
            <p>Completa el formulario para crear tu cuenta</p>
        </div>

        <!-- MENSAJE DE ERROR -->
        <div id="mensaje-error" class="error-message">
            <i class="fas fa-exclamation-circle"></i>
            No se encontró un enlace de invitación válido. Contacta al administrador.
        </div>

        <!-- FORMULARIO -->
        <form id="registroForm" novalidate>
            <!-- 🔥 CAMPO OCULTO PARA EL TOKEN (IMPORTANTE) -->
            <input type="hidden" id="token_invitacion" name="token_invitacion">

            <div class="form-group">
                <label for="tenant_id">ID de Puesto/Empresa <span class="required">*</span></label>
                <div class="input-wrapper">
                    <i class="fas fa-building"></i>
                    <input type="text" id="tenant_id" placeholder="ej: miempresa" required>
                </div>
            </div>

            <div class="form-group">
                <label for="nombre_empresa">Nombre de la Empresa <span class="required">*</span></label>
                <div class="input-wrapper">
                    <i class="fas fa-store"></i>
                    <input type="text" id="nombre_empresa" placeholder="Nombre completo de la empresa" required>
                </div>
            </div>

            <div class="form-group">
                <label for="nombre_admin">Nombre del Administrador <span class="required">*</span></label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="nombre_admin" placeholder="Nombre completo del administrador" required>
                </div>
            </div>

            <div class="form-group">
                <label for="correo_admin">Correo Electrónico <span class="required">*</span></label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="correo_admin" placeholder="admin@empresa.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password_admin">Contraseña <span class="required">*</span></label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password_admin" placeholder="Mínimo 6 caracteres" required minlength="6">
                </div>
            </div>

            <button type="submit" class="btn-register" id="btn-registrar">
                <span class="btn-text"><i class="fas fa-rocket"></i> Registrar Empresa</span>
                <span class="spinner"><i class="fas fa-spinner"></i></span>
            </button>
        </form>

        <!-- FOOTER -->
        <div class="footer">
            ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
        </div>
    </div>

    <script>
       
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            console.log('🔍 URL actual:', window.location.href);
            console.log('🔍 Token en URL:', token);

            if (token) {
                document.getElementById('token_invitacion').value = token;
                console.log('✅ Token de invitación capturado:', token);
            } else {
                document.getElementById('mensaje-error').style.display = 'block';
                const btn = document.getElementById('btn-registrar');
                btn.disabled = true;
                btn.style.opacity = '0.5';
                btn.querySelector('.btn-text').textContent = '❌ Enlace inválido';
            }
        });

        
        document.getElementById('registroForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const token = document.getElementById('token_invitacion').value;

            // Validar token
            if (!token) {
                alert('⚠️ No se encontró un enlace de invitación válido.');
                return;
            }

            const data = {
                tenant_id: document.getElementById('tenant_id').value.trim(),
                nombre_empresa: document.getElementById('nombre_empresa').value.trim(),
                nombre_admin: document.getElementById('nombre_admin').value.trim(),
                correo_electronico: document.getElementById('correo_admin').value.trim(),
                password: document.getElementById('password_admin').value,
                forzar_cambio_pw: true,
                token: token
            };

            if (!data.tenant_id || !data.nombre_empresa || !data.nombre_admin || !data.correo_electronico || !data.password) {
                alert('⚠️ Todos los campos son obligatorios.');
                return;
            }

            if (data.password.length < 6) {
                alert('⚠️ La contraseña debe tener al menos 6 caracteres.');
                return;
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(data.correo_electronico)) {
                alert('⚠️ Ingresa un correo electrónico válido.');
                return;
            }

            if (data.tenant_id.toLowerCase() === 'super_admin') {
                alert('❌ El Tenant ID "super_admin" está reservado.');
                return;
            }

            console.log('📦 Datos a enviar:', data);

            const btn = document.getElementById('btn-registrar');
            btn.disabled = true;
            btn.classList.add('loading');

            try {
                const response = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    alert(`✅ ¡Empresa "${data.nombre_empresa}" registrada exitosamente!\n\nAhora puedes iniciar sesión.`);
                    window.location.href = 'login.html?tenant=' + data.tenant_id;
                } else {
                    alert('❌ Error: ' + (result.message || 'Error desconocido.'));
                }
            } catch (error) {
                console.error('Error:', error);
                alert('❌ Error de conexión con el servidor.');
            } finally {
                btn.disabled = false;
                btn.classList.remove('loading');
            }
        });

        
        window.onclick = function(event) {
        };
    </script>

</body>
</html>
