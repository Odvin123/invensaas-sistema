<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar Contraseña - InvenSaaS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="js/config.js"></script>
    <style>
        /* ============================================
           ESTILOS (Mismo que login.html)
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --primary-gradient: linear-gradient(135deg, #6366f1, #8b5cf6);
            --secondary: #0f172a;
            --text: #1e293b;
            --text-light: #64748b;
            --white: #ffffff;
            --light: #f8fafc;
            --border: #e2e8f0;
            --success: #22c55e;
            --danger: #ef4444;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 8px 32px rgba(99, 102, 241, 0.2);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--light);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -30%;
            width: 600px;
            height: 600px;
            background: var(--primary-gradient);
            border-radius: 50%;
            opacity: 0.06;
            animation: floatBlob 8s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -20%;
            width: 500px;
            height: 500px;
            background: var(--primary-gradient);
            border-radius: 50%;
            opacity: 0.04;
            animation: floatBlob 10s ease-in-out infinite reverse;
        }

        @keyframes floatBlob {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(30px, -30px) scale(1.1);
            }
        }

        .login-wrapper {
            width: 100%;
            max-width: 440px;
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow-hover);
            padding: 40px;
            position: relative;
            z-index: 2;
            border: 1px solid rgba(226, 232, 240, 0.5);
            animation: fadeInUp 0.6s ease forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-header .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 28px;
            font-weight: 900;
            text-decoration: none;
            margin-bottom: 8px;
        }

        .login-header .logo .icon {
            width: 44px;
            height: 44px;
            background: var(--primary-gradient);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
        }

        .login-header .logo .text {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-header .logo .text span {
            color: var(--secondary);
            -webkit-text-fill-color: var(--secondary);
        }

        .login-header h2 {
            font-size: 24px;
            font-weight: 800;
            color: var(--secondary);
        }

        .login-header p {
            color: var(--text-light);
            font-size: 14px;
            margin-top: 4px;
        }

        .login-header .step {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-top: 8px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-weight: 600;
            font-size: 14px;
            color: var(--secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-group label i {
            color: var(--primary);
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: var(--transition);
            background: var(--light);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.08);
        }

        .form-group input::placeholder {
            color: #94a3b8;
        }

        .message {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            display: none;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fca5a5;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #16a34a;
            border: 1px solid #86efac;
        }

        .btn-submit {
            padding: 14px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .login-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-wrapper {
                padding: 24px 20px;
            }

            .login-header .logo {
                font-size: 24px;
            }

            .login-header h2 {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="login-wrapper">
        <div class="login-header">
            <div class="logo">
                <div class="icon"><i class="fas fa-cubes"></i></div>
                <div class="text">Inven<span>SaaS</span></div>
            </div>
            <h2>Recuperar Contraseña</h2>
            <p>Ingresa tus datos para recibir un código de seguridad</p>
            <span class="step">Paso 1 de 3</span>
        </div>

        <div id="message" class="message"></div>

        <form class="login-form" id="requestResetForm">
            <div class="form-group">
                <label><i class="fas fa-building"></i> ID de Puesto/Empresa</label>
                <input type="text" id="tenantId" placeholder="" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Correo Electrónico</label>
                <input type="email" id="email" placeholder="" required>
            </div>
            <button type="submit" class="btn-submit" id="continueButton">
                <i class="fas fa-arrow-right"></i> Continuar
            </button>
        </form>

        <div class="login-footer">
            <a href="login.html"><i class="fas fa-arrow-left"></i> Volver al Login</a>
        </div>
    </div>

    <script>
        const API_URL_RESET = API_URL + '/solicitar-reset-pw';
        const form = document.getElementById('requestResetForm');
        const message = document.getElementById('message');
        const btn = document.getElementById('continueButton');

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const tenant = urlParams.get('tenant');
            const email = urlParams.get('email');
            if (tenant) document.getElementById('tenantId').value = decodeURIComponent(tenant);
            if (email) document.getElementById('email').value = decodeURIComponent(email);
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            message.className = 'message';
            message.style.display = 'none';

            const tenant_id = document.getElementById('tenantId').value.trim();
            const correo_electronico = document.getElementById('email').value.trim();

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';

            try {
                const response = await fetch(API_URL_RESET, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tenant_id, correo_electronico })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    message.className = 'message success';
                    message.textContent = '✅ Código enviado a tu correo. Redirigiendo...';
                    message.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = `reset_password_code.html?tenant=${tenant_id}&email=${correo_electronico}`;
                    }, 2000);
                } else {
                    message.className = 'message error';
                    message.textContent = result.message || 'Error al enviar el código.';
                    message.style.display = 'block';
                }
            } catch (error) {
                message.className = 'message error';
                message.textContent = '❌ Error de conexión con el servidor.';
                message.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-arrow-right"></i> Continuar';
            }
        });
    </script>
</body>

</html>
