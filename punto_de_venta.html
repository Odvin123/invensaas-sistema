<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Venta - InvenSaaS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="js/config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-gradient: linear-gradient(135deg, #6366f1, #8b5cf6);
            --text: #1e293b;
            --text-light: #64748b;
            --white: #ffffff;
            --light: #f1f5f9;
            --border: #e2e8f0;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --radius: 16px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 8px 32px rgba(99, 102, 241, 0.15);
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--light);
            color: var(--text);
            min-height: 100vh;
        }

        /* TOP BAR */
        .top-bar {
            background: var(--white);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .top-bar .brand { display: flex; align-items: center; gap: 12px; }
        .top-bar .brand .logo {
            font-size: 22px;
            font-weight: 900;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .top-bar .brand .logo span { color: var(--text); -webkit-text-fill-color: var(--text); }

        .top-bar .info { display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--text-light); }
        .top-bar .info .badge { background: var(--light); padding: 6px 16px; border-radius: 20px; font-weight: 600; }
        .top-bar .info .badge i { color: var(--primary); margin-right: 6px; }

        .close-btn {
            background: var(--danger);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 18px;
            transition: var(--transition);
        }
        .close-btn:hover { transform: scale(1.05); }

        /* QUICK MENU */
        .quick-menu {
            padding: 8px 24px;
            background: var(--light);
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .quick-menu .btn {
            padding: 6px 14px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
            background: var(--white);
            color: var(--text-light);
            border: 1px solid var(--border);
        }
        .quick-menu .btn:hover { border-color: var(--primary); color: var(--primary); }

        /* MAIN */
        .pos-main {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 20px;
            padding: 20px 24px;
            max-width: 1400px;
            margin: 0 auto;
            min-height: calc(100vh - 160px);
        }

        /* 🔥 BUSCADOR RÁPIDO */
        .search-area {
            background: var(--white);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 16px 20px;
            margin-bottom: 16px;
            position: relative;
        }

        .search-area .search-input-wrap {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .search-area .search-input-wrap input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            transition: var(--transition);
            background: var(--light);
        }

        .search-area .search-input-wrap input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.08);
        }

        .search-area .search-input-wrap .hint {
            font-size: 12px;
            color: var(--text-light);
            white-space: nowrap;
        }

        /* 🔥 RESULTADOS DE BÚSQUEDA */
        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--white);
            border-radius: 0 0 var(--radius) var(--radius);
            border: 1px solid var(--border);
            border-top: none;
            max-height: 300px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            box-shadow: var(--shadow-hover);
        }

        .search-results.show { display: block; }

        .search-results .result-item {
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            transition: var(--transition);
        }

        .search-results .result-item:hover,
        .search-results .result-item.selected {
            background: rgba(99, 102, 241, 0.06);
        }

        .search-results .result-item .name { font-weight: 600; font-size: 14px; }
        .search-results .result-item .stock { font-size: 12px; color: var(--text-light); }
        .search-results .result-item .price { font-weight: 700; color: var(--primary); font-size: 14px; }
        .search-results .result-item .stock-badge {
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .stock-badge.in-stock { background: #dcfce7; color: #16a34a; }
        .stock-badge.low-stock { background: #fef3c7; color: #d97706; }
        .stock-badge.out-of-stock { background: #fee2e2; color: #dc2626; }

        /* 🔥 CANTIDAD RÁPIDA */
        .cantidad-rapida {
            display: none;
            padding: 12px 16px;
            background: var(--light);
            border-radius: 10px;
            margin-top: 10px;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .cantidad-rapida.show { display: flex; }

        .cantidad-rapida label { font-weight: 600; font-size: 14px; }
        .cantidad-rapida input {
            width: 100px;
            padding: 8px 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            font-family: 'Inter', sans-serif;
        }
        .cantidad-rapida input:focus { outline: none; border-color: var(--primary); }
        .cantidad-rapida .btn-add {
            padding: 8px 20px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }
        .cantidad-rapida .btn-add:hover { transform: translateY(-2px); }
        .cantidad-rapida .btn-cancel {
            padding: 8px 16px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        /* TABLA */
        .table-wrap {
            background: var(--white);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .table-wrap table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .table-wrap th {
            padding: 10px 12px;
            background: var(--light);
            color: var(--text-light);
            font-weight: 700;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--border);
            text-align: left;
        }

        .table-wrap th.text-right { text-align: right; }
        .table-wrap td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
        }
        .table-wrap td.text-right { text-align: right; }
        .table-wrap tr:hover td { background: rgba(99, 102, 241, 0.03); }
        .table-wrap .empty { text-align: center; color: var(--text-light); padding: 40px; }

        /* SIDEBAR */
        .pos-sidebar {
            background: var(--white);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: fit-content;
        }

        .pos-sidebar .total {
            text-align: center;
            padding: 12px;
            background: var(--light);
            border-radius: 12px;
        }
        .pos-sidebar .total .label { font-size: 13px; color: var(--text-light); font-weight: 600; }
        .pos-sidebar .total .amount { font-size: 32px; font-weight: 900; color: var(--primary); }

        .pos-sidebar .btn-cobrar {
            padding: 14px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 18px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .pos-sidebar .btn-cobrar:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(34,197,94,0.3); }

        .pos-sidebar .actions-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .pos-sidebar .actions-row .btn {
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
        }
        .pos-sidebar .actions-row .btn-danger { background: #fee2e2; color: var(--danger); }
        .pos-sidebar .actions-row .btn-danger:hover { background: #fecaca; }
        .pos-sidebar .actions-row .btn-warning { background: #fef3c7; color: #d97706; }
        .pos-sidebar .actions-row .btn-warning:hover { background: #fde68a; }

        .pos-footer {
            padding: 12px 24px;
            background: var(--white);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-light);
        }

        .pos-footer .footer-data { font-weight: 700; color: var(--text); cursor: pointer; }

        @media (max-width: 992px) {
            .pos-main { grid-template-columns: 1fr; }
        }

        @media (max-width: 768px) {
            .top-bar { flex-direction: column; gap: 10px; padding: 12px 16px; }
            .pos-main { padding: 12px 16px; }
            .search-area .search-input-wrap { flex-direction: column; align-items: stretch; }
            .search-area .search-input-wrap .hint { text-align: center; }
            .pos-sidebar .actions-row { grid-template-columns: 1fr; }
            .pos-footer { flex-direction: column; gap: 8px; text-align: center; }
        }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <header class="top-bar">
        <div class="brand">
            <span class="logo">Inven<span>SaaS</span></span>
            <span style="font-size:12px; background:var(--primary); color:white; padding:2px 12px; border-radius:20px;">POS</span>
        </div>
        <div class="info">
            <span class="badge"><i class="fas fa-building"></i> <span id="empresa-nombre">Cargando...</span></span>
            <span class="badge"><i class="fas fa-hashtag"></i> Folio: <span id="folio-number">1</span></span>
            <a href="inventario_dashboard.html" class="close-btn" title="Regresar"><i class="fas fa-times"></i></a>
        </div>
    </header>

    <!-- QUICK MENU -->
    <nav class="quick-menu">
        <button class="btn" onclick="openWindow('vendedores.html')"><i class="fas fa-user-tie"></i> Vendedores (F2)</button>
        <button class="btn" onclick="openWindow('clientes.html')"><i class="fas fa-users"></i> Clientes (F3)</button>
        <button class="btn" onclick="handleCorteCaja()"><i class="fas fa-cash-register"></i> Corte caja (F6)</button>
        <button class="btn" onclick="clearSale()"><i class="fas fa-times-circle"></i> Cancelar NV (F9)</button>
        <button class="btn" onclick="abrirModalCliente()"><i class="fas fa-user-edit"></i> Cliente actual</button>
    </nav>

    <!-- MAIN -->
    <main class="pos-main">

        <!-- COLUMNA IZQUIERDA -->
        <div>

            <!-- 🔥 BUSCADOR RÁPIDO -->
            <div class="search-area">
                <div class="search-input-wrap">
                    <input type="text" id="buscar-producto" placeholder="Escribe el nombre del producto..." 
                           oninput="buscarProductos(this.value)" 
                           onkeydown="manejarTeclasBusqueda(event)" 
                           autofocus>
                    <span class="hint">⬆⬇ Enter para seleccionar</span>
                </div>

                <!-- Resultados -->
                <div class="search-results" id="resultados-busqueda"></div>

                <!-- Cantidad rápida -->
                <div class="cantidad-rapida" id="cantidad-rapida">
                    <label>Cantidad:</label>
                    <input type="number" id="cantidad-input" value="1" step="any" min="0.01" onfocus="this.select()">
                    <button class="btn-add" onclick="agregarCantidad()"><i class="fas fa-plus"></i> Añadir</button>
                    <button class="btn-cancel" onclick="cancelarCantidad()">Cancelar</button>
                </div>
            </div>

            <!-- TABLA -->
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>CANT.</th>
                            <th>PRODUCTO</th>
                            <th class="text-right">PRECIO</th>
                            <th class="text-right">IMPORTE</th>
                        </tr>
                    </thead>
                    <tbody id="pos-tbody">
                        <tr><td colspan="4" class="empty"><i class="fas fa-search"></i> Busca productos para agregar</td></tr>
                    </tbody>
                </table>
            </div>

        </div>

        <!-- SIDEBAR -->
        <div class="pos-sidebar">
            <div class="total">
                <div class="label">TOTAL</div>
                <div class="amount" id="total-amount">C$0.00</div>
            </div>

            <button class="btn-cobrar" onclick="handleCobrar()" id="btnCobrar">
                <i class="fas fa-cash-register"></i> Cobrar (F8)
            </button>

            <div class="actions-row">
                <button class="btn btn-danger" onclick="removeLastItem()"><i class="fas fa-trash"></i> Eliminar</button>
                <button class="btn btn-warning" onclick="clearSale()"><i class="fas fa-eraser"></i> Borrar</button>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="pos-footer">
        <div>
            <span>Cliente: <span class="footer-data" id="footer-cliente" onclick="abrirModalCliente()">PUBLICO EN GENERAL</span></span>
            <span style="margin-left:20px;">Vendedor: <span class="footer-data" id="footer-vendedor">MOSTRADOR</span></span>
        </div>
        <div class="datetime">
            <span id="current-date">--</span>
            <span id="current-time">--</span>
        </div>
    </footer>

    <!-- MODAL CLIENTE -->
    <div id="clienteModal" class="modal" style="display:none; position:fixed; z-index:1000; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px);">
        <div style="background:white; margin:10% auto; padding:28px; border-radius:16px; width:90%; max-width:400px; box-shadow:0 24px 48px rgba(0,0,0,0.2);">
            <span onclick="cerrarModalCliente()" style="float:right; font-size:28px; font-weight:700; cursor:pointer;">&times;</span>
            <h3 style="margin-bottom:16px;"><i class="fas fa-user"></i> Seleccionar Cliente</h3>
            <input type="text" id="buscar-cliente" placeholder="Buscar cliente..." style="width:100%; padding:10px; border:2px solid var(--border); border-radius:8px; margin-bottom:12px;">
            <div id="lista-clientes" style="max-height:300px; overflow-y:auto;"></div>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURACIÓN
        // ============================================
        const token = localStorage.getItem('token');
        const API_URL = window.API_URL || 'https://invensaas-backend.onrender.com/api';

        let ventaActual = [];
        let productosCache = [];
        let productosFiltrados = [];
        let productoSeleccionado = null;
        let clientesCache = [];
        let indiceSeleccionado = -1;

        // ============================================
        // ELEMENTOS DOM
        // ============================================
        const tbody = document.getElementById('pos-tbody');
        const totalAmount = document.getElementById('total-amount');
        const buscarInput = document.getElementById('buscar-producto');
        const resultadosDiv = document.getElementById('resultados-busqueda');
        const cantidadRapida = document.getElementById('cantidad-rapida');
        const cantidadInput = document.getElementById('cantidad-input');

        // ============================================
        // FUNCIONES PRINCIPALES
        // ============================================

        async function loadProductos() {
            try {
                const response = await fetch(`${API_URL}/admin/productos`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                if (data.success) {
                    productosCache = data.productos || [];
                }
            } catch (e) { console.error('Error cargando productos:', e); }
        }

        async function loadClientes() {
            try {
                const response = await fetch(`${API_URL}/admin/clientes`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                if (data.success) {
                    clientesCache = data.clientes || [];
                }
            } catch (e) { console.error('Error cargando clientes:', e); }
        }

        function buscarProductos(texto) {
            const search = texto.toLowerCase().trim();
            const resultados = document.getElementById('resultados-busqueda');
            const cantidadRapidaDiv = document.getElementById('cantidad-rapida');

            // Ocultar cantidad rápida
            cantidadRapidaDiv.classList.remove('show');
            productoSeleccionado = null;

            if (search.length < 2) {
                resultados.classList.remove('show');
                return;
            }

            productosFiltrados = productosCache.filter(p =>
                p.descripcion.toLowerCase().includes(search)
            ).slice(0, 8);

            if (productosFiltrados.length === 0) {
                resultados.innerHTML = '<div class="result-item" style="color:var(--text-light); justify-content:center;">No se encontraron productos</div>';
                resultados.classList.add('show');
                return;
            }

            let html = '';
            productosFiltrados.forEach((p, index) => {
                const stock = Number(p.stock) || 0;
                let stockClass = 'in-stock';
                let stockText = 'Stock: ' + stock.toFixed(2);
                if (stock === 0) { stockClass = 'out-of-stock'; stockText = 'Agotado'; }
                else if (stock < 5) { stockClass = 'low-stock'; }

                html += `
                    <div class="result-item ${index === indiceSeleccionado ? 'selected' : ''}" 
                         onclick="seleccionarProducto(${p.id})"
                         onmouseenter="indiceSeleccionado = ${index}">
                        <div>
                            <div class="name">${p.descripcion}</div>
                            <div class="stock">${stockText}</div>
                        </div>
                        <div>
                            <div class="price">C$${Number(p.precio).toFixed(2)}</div>
                            <span class="stock-badge ${stockClass}">${stock > 0 ? 'Disponible' : 'Agotado'}</span>
                        </div>
                    </div>
                `;
            });

            resultados.innerHTML = html;
            resultados.classList.add('show');
            indiceSeleccionado = -1;
        }

        function seleccionarProducto(id) {
            const producto = productosCache.find(p => p.id === id);
            if (!producto) return;

            const stock = Number(producto.stock) || 0;
            if (stock === 0) {
                alert('⚠️ Producto agotado.');
                return;
            }

            productoSeleccionado = producto;
            document.getElementById('resultados-busqueda').classList.remove('show');
            document.getElementById('cantidad-rapida').classList.add('show');
            cantidadInput.value = 1;
            cantidadInput.focus();
            cantidadInput.select();
        }

        function agregarCantidad() {
            if (!productoSeleccionado) return;

            const cantidad = parseFloat(cantidadInput.value) || 0;
            if (cantidad <= 0) {
                alert('⚠️ Ingresa una cantidad válida.');
                return;
            }

            const stock = Number(productoSeleccionado.stock) || 0;
            const existing = ventaActual.find(item => item.id === productoSeleccionado.id);
            const totalEnVenta = existing ? existing.cantidad : 0;

            if ((totalEnVenta + cantidad) > stock) {
                alert(`⚠️ Stock insuficiente. Disponible: ${stock.toFixed(2)}`);
                return;
            }

            addProductToSale(productoSeleccionado, cantidad);
            cancelarCantidad();
            buscarInput.value = '';
            buscarInput.focus();
        }

        function cancelarCantidad() {
            document.getElementById('cantidad-rapida').classList.remove('show');
            productoSeleccionado = null;
            buscarInput.focus();
        }

        function addProductToSale(producto, cantidad) {
            const existing = ventaActual.find(item => item.id === producto.id);
            if (existing) {
                existing.cantidad += cantidad;
                existing.importe = existing.cantidad * existing.precio;
            } else {
                ventaActual.push({
                    id: producto.id,
                    descripcion: producto.descripcion,
                    cantidad: cantidad,
                    precio: Number(producto.precio) || 0,
                    importe: cantidad * (Number(producto.precio) || 0)
                });
            }
            renderVenta();
        }

        function renderVenta() {
            tbody.innerHTML = '';
            let total = 0;

            if (ventaActual.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="empty"><i class="fas fa-search"></i> Busca productos para agregar</td></tr>';
                totalAmount.textContent = 'C$0.00';
                return;
            }

            ventaActual.forEach(item => {
                total += item.importe;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.cantidad}</td>
                    <td>${item.descripcion}</td>
                    <td class="text-right">C$${item.precio.toFixed(2)}</td>
                    <td class="text-right">C$${item.importe.toFixed(2)}</td>
                `;
                tbody.appendChild(tr);
            });

            totalAmount.textContent = `C$${total.toFixed(2)}`;
        }

        function removeLastItem() {
            if (ventaActual.length === 0) return;
            ventaActual.pop();
            renderVenta();
        }

        function clearSale() {
            if (ventaActual.length === 0) return;
            if (!confirm('¿Borrar toda la venta?')) return;
            ventaActual = [];
            renderVenta();
            buscarInput.focus();
        }

        // ============================================
        // MANEJO DE TECLAS
        // ============================================
        function manejarTeclasBusqueda(event) {
            const resultados = document.getElementById('resultados-busqueda');
            const items = resultados.querySelectorAll('.result-item');

            if (event.key === 'ArrowDown') {
                event.preventDefault();
                indiceSeleccionado = Math.min(indiceSeleccionado + 1, items.length - 1);
                actualizarSeleccion(items);
            } else if (event.key === 'ArrowUp') {
                event.preventDefault();
                indiceSeleccionado = Math.max(indiceSeleccionado - 1, 0);
                actualizarSeleccion(items);
            } else if (event.key === 'Enter') {
                event.preventDefault();
                if (productoSeleccionado && document.getElementById('cantidad-rapida').classList.contains('show')) {
                    agregarCantidad();
                } else if (indiceSeleccionado >= 0 && items[indiceSeleccionado]) {
                    items[indiceSeleccionado].click();
                }
            } else if (event.key === 'Escape') {
                resultados.classList.remove('show');
                cancelarCantidad();
                buscarInput.value = '';
            }
        }

        function actualizarSeleccion(items) {
            items.forEach((item, index) => {
                item.classList.toggle('selected', index === indiceSeleccionado);
            });
            if (indiceSeleccionado >= 0 && items[indiceSeleccionado]) {
                const id = items[indiceSeleccionado].getAttribute('onclick')?.match(/\d+/)?.[0];
                if (id) productoSeleccionado = productosCache.find(p => p.id == id);
            }
        }

        // ============================================
        // CLIENTES
        // ============================================
        function abrirModalCliente() {
            document.getElementById('clienteModal').style.display = 'block';
            renderClientes();
            document.getElementById('buscar-cliente').value = '';
            document.getElementById('buscar-cliente').focus();
        }

        function cerrarModalCliente() {
            document.getElementById('clienteModal').style.display = 'none';
        }

        function renderClientes() {
            const container = document.getElementById('lista-clientes');
            const filtro = document.getElementById('buscar-cliente').value.toLowerCase();
            const clientes = clientesCache.filter(c => c.nombre.toLowerCase().includes(filtro));

            if (clientes.length === 0) {
                container.innerHTML = '<div style="padding:20px; color:var(--text-light); text-align:center;">No hay clientes</div>';
                return;
            }

            let html = '';
            clientes.forEach(c => {
                html += `
                    <div style="padding:10px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
                        <span>${c.nombre}</span>
                        <button onclick="seleccionarCliente('${c.nombre}')" style="padding:4px 12px; background:var(--primary); color:white; border:none; border-radius:6px; cursor:pointer;">Seleccionar</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function seleccionarCliente(nombre) {
            document.getElementById('footer-cliente').textContent = nombre;
            localStorage.setItem('currentClienteName', nombre);
            cerrarModalCliente();
        }

        // ============================================
        // COBRAR
        // ============================================
        function handleCobrar() {
            if (ventaActual.length === 0) {
                alert('No hay productos para cobrar.');
                return;
            }

            const total = ventaActual.reduce((sum, item) => sum + item.importe, 0);
            const cliente = document.getElementById('footer-cliente').textContent;
            const vendedor = document.getElementById('footer-vendedor').textContent;

            // Mostrar resumen rápido
            const confirmar = confirm(
                `📋 Resumen de venta:\n` +
                `Cliente: ${cliente}\n` +
                `Vendedor: ${vendedor}\n` +
                `Total: C$${total.toFixed(2)}\n\n` +
                `¿Confirmar venta?`
            );

            if (!confirmar) return;

            // Aquí iría la lógica de guardar la venta
            alert(`✅ Venta registrada por C$${total.toFixed(2)}`);
            ventaActual = [];
            renderVenta();
        }

        // ============================================
        // UTILIDADES
        // ============================================
        function openWindow(url) { window.open(url, '_blank', 'width=800,height=600,scrollbars=yes'); }
        function handleCorteCaja() { alert('Función de corte de caja en desarrollo'); }
        function updateDateTime() {
            const now = new Date();
            document.getElementById('current-date').textContent = now.toLocaleDateString('es-NI');
            document.getElementById('current-time').textContent = now.toLocaleTimeString('es-NI');
        }

        // ============================================
        // INICIALIZACIÓN
        // ============================================
        document.addEventListener('DOMContentLoaded', async () => {
            if (!token) {
                alert('Sesión no válida. Redirigiendo...');
                window.location.href = 'login.html';
                return;
            }

            await loadProductos();
            await loadClientes();

            const nombreEmpresa = localStorage.getItem('nombre_empresa') || 'Mi Empresa';
            document.getElementById('empresa-nombre').textContent = nombreEmpresa;

            try {
                const folioRes = await fetch(`${API_URL}/admin/ventas/folio_actual`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const folioData = await folioRes.json();
                document.getElementById('folio-number').textContent = folioData.success ? folioData.folio : '1';
            } catch (e) { console.error(e); }

            updateDateTime();
            setInterval(updateDateTime, 1000);
            renderVenta();

            // Cerrar modal al hacer clic fuera
            document.getElementById('clienteModal').addEventListener('click', function(e) {
                if (e.target === this) cerrarModalCliente();
            });

            // Buscar cliente en tiempo real
            document.getElementById('buscar-cliente').addEventListener('input', renderClientes);

            // Atajos de teclado
            document.addEventListener('keydown', function(e) {
                if (e.key === 'F8' && !e.target.closest('input')) {
                    e.preventDefault();
                    handleCobrar();
                }
                if (e.key === 'F9' && !e.target.closest('input')) {
                    e.preventDefault();
                    clearSale();
                }
                if (e.key === 'Delete' && !e.target.closest('input')) {
                    e.preventDefault();
                    removeLastItem();
                }
            });

            // Enfoque automático
            setTimeout(() => buscarInput.focus(), 100);
        });
    </script>

</body>
</html>
