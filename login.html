<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - InvenSaaS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="js/config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --bg-main: #f8fafc;
            --bg-white: #ffffff;
            --border: #e2e8f0;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            --radius: 16px;
            --radius-sm: 8px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: var(--bg-white);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 48px;
            width: 100%;
            max-width: 440px;
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header .logo {
            font-size: 32px;
            font-weight: 900;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .login-header .logo span {
            -webkit-text-fill-color: var(--primary);
        }

        .login-header h2 {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-primary);
            margin-top: 8px;
        }

        .login-header p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .form-group label .required {
            color: var(--danger);
            margin-left: 2px;
        }

        .form-group .input-wrapper {
            position: relative;
        }

        .form-group .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            transition: var(--transition);
            background: var(--bg-white);
            color: var(--text-primary);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .form-group input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--primary-gradient);
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-login:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-login .spinner {
            display: none;
            animation: spin 1s linear infinite;
        }

        .btn-login.loading .spinner {
            display: inline-block;
        }

        .btn-login.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .message-box {
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 16px;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .message-box.show {
            display: flex;
        }

        .message-box.error {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .message-box.success {
            background: #dcfce7;
            color: #16a34a;
            border: 1px solid #bbf7d0;
        }

        .message-box.warning {
            background: #fef3c7;
            color: #d97706;
            border: 1px solid #fde68a;
        }

        .message-box .message-icon {
            font-size: 18px;
            flex-shrink: 0;
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .login-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .login-footer a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        /* ============================================
           RESPONSIVE
        ============================================ */
        @media (max-width: 480px) {
            .login-container {
                padding: 32px 24px;
            }

            .login-header .logo {
                font-size: 26px;
            }

            .login-header h2 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- HEADER -->
        <div class="login-header">
            <div class="logo">Inven<span>SaaS</span></div>
            <h2>Iniciar Sesión</h2>
            <p>Ingresa tus credenciales para acceder</p>
        </div>

        <!-- MESSAGE BOX -->
        <div id="messageBox" class="message-box">
            <span class="message-icon" id="messageIcon"><i class="fas fa-exclamation-circle"></i></span>
            <span id="messageText">Mensaje de error</span>
        </div>

        <!-- FORM -->
        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="tenant_id">Tenant ID <span class="required">*</span></label>
                <div class="input-wrapper">
                    <i class="fas fa-building"></i>
                    <input type="text" id="tenant_id" placeholder="Ej: super_admin" required>
                </div>
            </div>

            <div class="form-group">
                <label for="correo_electronico">Correo Electrónico <span class="required">*</span></label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="correo_electronico" placeholder="admin@empresa.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña <span class="required">*</span></label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span class="btn-text"><i class="fas fa-sign-in-alt"></i> Iniciar Sesión</span>
                <span class="spinner"><i class="fas fa-spinner"></i></span>
            </button>
        </form>

        <div class="login-footer">
            ¿Olvidaste tu contraseña? <a href="recuperar.html">Recupérala aquí</a>
        </div>
    </div>

    <script>
        const API_URL = window.API_URL || 'https://invensaas-backend.onrender.com/api';
        let intentosFallidos = 0;
        let bloqueado = false;
        let tiempoRestante = 0;
        let contadorInterval = null;

        // ============================================
        // DOM ELEMENTS
        // ============================================
        const form = document.getElementById('loginForm');
        const tenantInput = document.getElementById('tenant_id');
        const emailInput = document.getElementById('correo_electronico');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const messageBox = document.getElementById('messageBox');
        const messageText = document.getElementById('messageText');
        const messageIcon = document.getElementById('messageIcon');

        // ============================================
        // FUNCIONES DE MENSAJES
        // ============================================
        function showMessage(text, type = 'error', icon = 'fa-exclamation-circle') {
            messageBox.className = `message-box show ${type}`;
            messageText.textContent = text;
            messageIcon.innerHTML = `<i class="fas ${icon}"></i>`;
            
            // Ocultar mensaje después de 8 segundos
            clearTimeout(window.messageTimeout);
            window.messageTimeout = setTimeout(() => {
                messageBox.classList.remove('show');
            }, 8000);
        }

        function hideMessage() {
            messageBox.classList.remove('show');
            clearTimeout(window.messageTimeout);
        }

        // ============================================
        // FUNCIÓN DE LOGIN
        // ============================================
        async function handleLogin(e) {
            e.preventDefault();
            hideMessage();

            // Verificar si está bloqueado
            if (bloqueado) {
                showMessage(
                    `⛔ Demasiados intentos fallidos. Espera ${tiempoRestante} segundos para intentar nuevamente.`,
                    'warning',
                    'fa-clock'
                );
                return;
            }

            // Obtener datos
            const tenant_id = tenantInput.value.trim();
            const correo_electronico = emailInput.value.trim();
            const password = passwordInput.value;

            // Validaciones básicas
            if (!tenant_id || !correo_electronico || !password) {
                showMessage('⚠️ Todos los campos son obligatorios.', 'error', 'fa-exclamation-triangle');
                return;
            }

            // Validar formato de email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(correo_electronico)) {
                showMessage('⚠️ Ingresa un correo electrónico válido.', 'error', 'fa-envelope');
                return;
            }

            // Estado de carga
            loginBtn.disabled = true;
            loginBtn.classList.add('loading');

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        tenant_id,
                        correo_electronico,
                        password
                    })
                });

                const data = await response.json();

                // Manejar respuesta 429 (Rate Limit)
                if (response.status === 429) {
                    const mensaje = data.message || 'Demasiados intentos fallidos. Espera unos segundos.';
                    showMessage(`⛔ ${mensaje}`, 'warning', 'fa-clock');
                    
                    // Bloquear por 10 segundos
                    bloquearLogin(10);
                    return;
                }

                if (response.ok && data.success) {
                    // ✅ LOGIN EXITOSO
                    showMessage('✅ ¡Bienvenido! Redirigiendo...', 'success', 'fa-check-circle');
                    
                    // Guardar token
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('tenant_id', data.tenant_id);
                    localStorage.setItem('rol', data.rol);
                    
                    // Resetear intentos
                    intentosFallidos = 0;
                    
                    // Redirigir según rol
                    setTimeout(() => {
                        if (data.rol === 'super_admin') {
                            window.location.href = 'dashboard_superadmin.html';
                        } else if (data.rol === 'administrador') {
                            window.location.href = 'dashboard_admin.html';
                        } else {
                            window.location.href = 'dashboard_vendedor.html';
                        }
                    }, 1500);
                } else {
                    // ❌ LOGIN FALLIDO
                    intentosFallidos++;
                    
                    const mensaje = data.message || 'Credenciales incorrectas.';
                    const intentosRestantes = 3 - intentosFallidos;
                    
                    if (intentosRestantes > 0) {
                        showMessage(
                            `❌ ${mensaje} (${intentosRestantes} intentos restantes)`,
                            'error',
                            'fa-times-circle'
                        );
                    } else {
                        // Bloquear después de 3 intentos
                        showMessage(
                            '⛔ Demasiados intentos fallidos. Bloqueado por 10 segundos.',
                            'warning',
                            'fa-clock'
                        );
                        bloquearLogin(10);
                    }
                }

            } catch (error) {
                console.error('Error de conexión:', error);
                showMessage('❌ Error de conexión. Verifica tu internet.', 'error', 'fa-wifi');
            } finally {
                // Restaurar botón
                loginBtn.disabled = false;
                loginBtn.classList.remove('loading');
                
                // Limpiar contraseña por seguridad
                passwordInput.value = '';
            }
        }

        // ============================================
        // FUNCIÓN DE BLOQUEO
        // ============================================
        function bloquearLogin(segundos) {
            bloqueado = true;
            tiempoRestante = segundos;
            
            // Deshabilitar campos
            tenantInput.disabled = true;
            emailInput.disabled = true;
            passwordInput.disabled = true;
            loginBtn.disabled = true;
            
            // Mostrar contador en el botón
            loginBtn.innerHTML = `<span class="btn-text"><i class="fas fa-clock"></i> Espera ${tiempoRestante}s</span>`;
            
           
            if (contadorInterval) clearInterval(contadorInterval);
            
            contadorInterval = setInterval(() => {
                tiempoRestante--;
                
                if (tiempoRestante <= 0) {
                    clearInterval(contadorInterval);
                    desbloquearLogin();
                } else {
                    loginBtn.innerHTML = `<span class="btn-text"><i class="fas fa-clock"></i> Espera ${tiempoRestante}s</span>`;
                }
            }, 1000);
        }

        function desbloquearLogin() {
            bloqueado = false;
            tiempoRestante = 0;
            intentosFallidos = 0;
            
            tenantInput.disabled = false;
            emailInput.disabled = false;
            passwordInput.disabled = false;
            loginBtn.disabled = false;
            
            loginBtn.innerHTML = `<span class="btn-text"><i class="fas fa-sign-in-alt"></i> Iniciar Sesión</span><span class="spinner"><i class="fas fa-spinner"></i></span>`;
            
            hideMessage();
            showMessage('✅ Ya puedes intentar nuevamente.', 'success', 'fa-check-circle');
            
            setTimeout(() => {
                hideMessage();
            }, 3000);
        }

        
        form.addEventListener('submit', handleLogin);

        tenantInput.addEventListener('input', hideMessage);
        emailInput.addEventListener('input', hideMessage);
        passwordInput.addEventListener('input', hideMessage);

        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            const rol = localStorage.getItem('rol');
            
            if (token && rol) {
                
                if (rol === 'super_admin') {
                    window.location.href = 'dashboard_superadmin.html';
                } else if (rol === 'administrador') {
                    window.location.href = 'dashboard_admin.html';
                } else if (rol === 'vendedor') {
                    window.location.href = 'dashboard_vendedor.html';
                }
            }
        });

      
    </script>

</body>
</html>
