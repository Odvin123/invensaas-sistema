<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Productos Vendidos | InvenSaaS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/reporte_productos_vendidos.css">
    <script src="js/config.js"></script>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="page-header">
            <h1><i class="fas fa-boxes"></i> Reporte de Productos Vendidos</h1>
            <a href="inventario_dashboard.html" class="btn-back">
                <i class="fas fa-arrow-left"></i> Volver al Panel Principal
            </a>
        </div>

        <!-- FILTROS -->
        <div class="toolbar">
            <div class="filters">
                <div class="group">
                    <label><i class="fas fa-calendar-alt"></i> Fecha Inicial</label>
                    <input type="date" id="fecha-inicio">
                </div>
                <div class="group">
                    <label><i class="fas fa-calendar-alt"></i> Fecha Final</label>
                    <input type="date" id="fecha-fin">
                </div>
                <button class="btn-execute" id="btn-mostrar"><i class="fas fa-eye"></i> Mostrar</button>
                <button class="btn-refresh" id="btn-refrescar"><i class="fas fa-sync-alt"></i> Refrescar</button>
            </div>
            <div class="actions">
                <button class="btn btn-export" id="btn-exportar"><i class="fas fa-file-export"></i> Exportar CSV</button>
                <button class="btn btn-print" onclick="window.print()"><i class="fas fa-print"></i> Imprimir</button>
            </div>
        </div>

        <!-- TABLA DE PRODUCTOS VENDIDOS -->
        <div class="table-card">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th style="min-width:100px;">Fecha</th>
                            <th style="text-align:center; width:70px;">Clave</th>
                            <th style="min-width:120px;">Descripción</th>
                            <th style="text-align:center; width:80px;">Cantidad</th>
                            <th style="text-align:right; width:100px;">Venta</th>
                            <th style="text-align:right; width:90px;">Precio</th>
                            <th style="text-align:right; width:100px;">Costo</th>
                            <th style="text-align:right; width:100px;">Recuperación</th>
                            <th style="text-align:right; width:100px;">Ganancia</th>
                        </tr>
                    </thead>
                    <tbody id="productos-tbody">
                        <tr><td colspan="9" class="empty"><i class="fas fa-spinner fa-spin"></i> Cargando productos...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- TOTALES FOOTER -->
        <div class="totals-footer">
            <div class="item">
                <div class="label"><i class="fas fa-shopping-cart"></i> Total Productos</div>
                <div class="value primary" id="total-productos">0</div>
            </div>
            <div class="item">
                <div class="label"><i class="fas fa-money-bill-wave"></i> Total Ventas</div>
                <div class="value success" id="total-ventas">C$0.00</div>
            </div>
            <div class="item">
                <div class="label"><i class="fas fa-coins"></i> Ganancia Total</div>
                <div class="value success" id="total-ganancia">C$0.00</div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            console.log('🚀 ===== REPORTE DE PRODUCTOS VENDIDOS INICIADO =====');
            
            const token = localStorage.getItem('token');
            const API_URL = window.API_URL || 'https://invensaas-backend.onrender.com/api';
            let todosLosProductos = [];
            
            console.log('🔑 Token:', token ? '✅ Sí' : '❌ No');
            console.log('🌐 API_URL:', API_URL);

            if (!token) {
                document.getElementById('productos-tbody').innerHTML = 
                    '<tr><td colspan="9" class="empty">❌ Sesión no válida. <a href="login.html">Iniciar sesión</a></td></tr>';
                return;
            }

            const tbody = document.getElementById('productos-tbody');
            const totalProductosEl = document.getElementById('total-productos');
            const totalVentasEl = document.getElementById('total-ventas');
            const totalGananciaEl = document.getElementById('total-ganancia');

            // ============================================
            // FUNCIONES AUXILIARES
            // ============================================

            function formatNumber(value) {
                const num = Number(value);
                return isNaN(num) ? '0.00' : num.toFixed(2);
            }

            function formatCurrency(value) {
                return `C$${formatNumber(value)}`;
            }

            function formatDate(dateStr) {
                if (!dateStr) return '—';
                try {
                    const date = new Date(dateStr);
                    return date.toLocaleDateString('es-NI', {
                        day: '2-digit', 
                        month: '2-digit', 
                        year: 'numeric'
                    });
                } catch {
                    return dateStr;
                }
            }

            
            function renderProductos(productos) {
    if (!productos || productos.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" class="empty">📭 No hay productos vendidos en este período.</td></tr>';
        totalProductosEl.textContent = '0';
        totalVentasEl.textContent = 'C$0.00';
        totalGananciaEl.textContent = 'C$0.00';
        return;
    }

    let html = '';
    let totalVentas = 0;
    let totalGanancia = 0;
    let totalUnidades = 0;

    productos.forEach(p => {
        const cantidad = Number(p.cantidad) || 0;
        const venta = Number(p.venta) || 0;           
        const costo = Number(p.costo) || 0;
        const ganancia = Number(p.ganancia) || 0;    
        const descuento = Number(p.descuento) || 0;
        
        totalVentas += venta;
        totalGanancia += ganancia;
        totalUnidades += cantidad;

        const gananciaColor = ganancia >= 0 ? 'var(--success)' : 'var(--danger)';
        
        let descuentoTexto = '';
        if (descuento > 0) {
            descuentoTexto = ` <small style="color:var(--text-light);">(Desc: C$${descuento.toFixed(2)})</small>`;
        }

        html += `
            <tr>
                <td>${formatDate(p.fecha_venta)}</td>
                <td style="text-align:center; font-weight:600;">${p.clave || '—'}</td>
                <td>${p.descripcion || 'Producto'} ${descuentoTexto}</td>
                <td style="text-align:center; font-weight:600;">${formatNumber(cantidad)}</td>
                <td style="text-align:right; font-weight:600; color:var(--primary);">${formatCurrency(venta)}</td>
                <td style="text-align:right;">${formatCurrency(p.precio_unitario)}</td>
                <td style="text-align:right;">${formatCurrency(costo)}</td>
                <td style="text-align:right;">${formatCurrency(costo)}</td>
                <td style="text-align:right; font-weight:700; color:${gananciaColor};">${formatCurrency(ganancia)}</td>
            </tr>
        `;
    });

    tbody.innerHTML = html;
    totalProductosEl.textContent = formatNumber(totalUnidades);
    totalVentasEl.textContent = formatCurrency(totalVentas);
    totalGananciaEl.textContent = formatCurrency(totalGanancia);

    if (totalGanancia < 0) {
        totalGananciaEl.style.color = 'var(--danger)';
    } else {
        totalGananciaEl.style.color = 'var(--success)';
    }

    console.log('✅ Tabla renderizada con', productos.length, 'productos');
}
            // ============================================
            // EXPORTAR CSV
            // ============================================

            document.getElementById('btn-exportar').addEventListener('click', function() {
                const rows = tbody.querySelectorAll('tr');
                
                if (rows.length === 0 || rows[0].classList.contains('empty')) {
                    alert('⚠️ No hay datos para exportar.');
                    return;
                }

                const data = [];
                const headers = ['Fecha', 'Clave', 'Descripción', 'Cantidad', 'Venta', 'Precio', 'Costo', 'Recuperación', 'Ganancia'];
                data.push(headers);

                rows.forEach(row => {
                    const cols = row.querySelectorAll('td');
                    if (cols.length > 0) {
                        const rowData = [];
                        cols.forEach(col => {
                            let text = col.textContent.trim();
                            text = text.replace(/[^\w\s\d.,$C\-]/g, '').trim();
                            rowData.push(text);
                        });
                        if (rowData.length === 9) {
                            data.push(rowData);
                        }
                    }
                });

                let csvContent = '';
                data.forEach(row => {
                    const escapedRow = row.map(cell => {
                        if (typeof cell === 'string' && (cell.includes(',') || cell.includes('"') || cell.includes('\n'))) {
                            return `"${cell.replace(/"/g, '""')}"`;
                        }
                        return cell;
                    });
                    csvContent += escapedRow.join(',') + '\n';
                });

                const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                const url = URL.createObjectURL(blob);
                link.setAttribute('href', url);
                
                const now = new Date();
                const fechaStr = now.toISOString().slice(0, 10);
                link.setAttribute('download', `productos_vendidos_${fechaStr}.csv`);
                
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);

                console.log('✅ CSV exportado correctamente');
            });

            // ============================================
            // CARGAR PRODUCTOS VENDIDOS
            // ============================================

            async function loadProductos(filtros = {}) {
                console.log('🔄 Cargando productos vendidos...');
                tbody.innerHTML = '<tr><td colspan="9" class="empty"><i class="fas fa-spinner fa-spin"></i> Cargando...</td></tr>';

                try {
                    let url = `${API_URL}/admin/ventas/productos-vendidos`;
                    const params = new URLSearchParams();
                    
                    if (filtros.inicio) params.append('inicio', filtros.inicio);
                    if (filtros.fin) params.append('fin', filtros.fin);
                    
                    if (params.toString()) {
                        url += '?' + params.toString();
                    }

                    console.log('📡 URL:', url);

                    const response = await fetch(url, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });

                    console.log('📡 Status:', response.status);

                    if (response.status === 401) {
                        tbody.innerHTML = '<tr><td colspan="9" class="empty">❌ Sesión expirada. <a href="login.html">Iniciar sesión</a></td></tr>';
                        return;
                    }

                    const data = await response.json();
                    console.log('📦 Datos recibidos:', data);

                    if (!data.success || !data.productos) {
                        tbody.innerHTML = '<tr><td colspan="9" class="empty">❌ Error al cargar productos vendidos.</td></tr>';
                        return;
                    }

                    todosLosProductos = data.productos;
                    console.log('📊 Productos encontrados:', todosLosProductos.length);

                    renderProductos(todosLosProductos);

                } catch (error) {
                    console.error('❌ Error:', error);
                    tbody.innerHTML = `<tr><td colspan="9" class="empty">❌ Error de conexión: ${error.message}</td></tr>`;
                }
            }

            // ============================================
            // EVENTOS
            // ============================================

            document.getElementById('btn-mostrar').addEventListener('click', () => {
                const inicio = document.getElementById('fecha-inicio').value;
                const fin = document.getElementById('fecha-fin').value;
                
                if (!inicio || !fin) {
                    alert('⚠️ Selecciona ambas fechas (inicial y final) para filtrar.');
                    return;
                }
                
                loadProductos({ inicio, fin });
            });

            document.getElementById('btn-refrescar').addEventListener('click', () => {
                document.getElementById('fecha-inicio').value = '';
                document.getElementById('fecha-fin').value = '';
                loadProductos({});
            });

            // ============================================
            // INICIAR
            // ============================================

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', () => loadProductos({}));
            } else {
                loadProductos({});
            }

        })();
    </script>
</body>
</html>
