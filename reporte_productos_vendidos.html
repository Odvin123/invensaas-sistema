<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Productos Vendidos | InvenSaaS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/reporte_productos_vendidos.css">
    <script src="js/config.js"></script>
</head>

<body>
    <div class="container">
        <!-- HEADER -->
        <div class="page-header">
            <h1><i class="fas fa-boxes"></i> Reporte de Productos Vendidos</h1>
            <a href="inventario_dashboard.html" class="btn-back">
                <i class="fas fa-arrow-left"></i> Volver al Panel Principal
            </a>
        </div>

        <!-- FILTROS -->
        <div class="toolbar">
            <div class="filters">
                <div class="group">
                    <label><i class="fas fa-calendar-alt"></i> Fecha Inicial</label>
                    <input type="date" id="fecha-inicio">
                </div>
                <div class="group">
                    <label><i class="fas fa-calendar-alt"></i> Fecha Final</label>
                    <input type="date" id="fecha-fin">
                </div>

                <!-- 🔍 NUEVO FILTRO DE BÚSQUEDA POR DESCRIPCIÓN -->
                <div class="group search-group">
                    <label><i class="fas fa-search"></i> Buscar Producto</label>
                    <div class="search-wrapper">
                        <input type="text" id="search-producto" placeholder="Escribe para filtrar..." autocomplete="off">
                        <button class="clear-search" id="clear-search" aria-label="Limpiar búsqueda">
                            <i class="fas fa-times-circle"></i>
                        </button>
                    </div>
                </div>

                <button class="btn-execute" id="btn-mostrar"><i class="fas fa-eye"></i> Mostrar</button>
                <button class="btn-refresh" id="btn-refrescar"><i class="fas fa-sync-alt"></i> Refrescar</button>
            </div>
            <div class="actions">
                <button class="btn btn-export" id="btn-exportar"><i class="fas fa-file-export"></i> Exportar
                    CSV</button>
                <button class="btn btn-print" onclick="window.print()"><i class="fas fa-print"></i> Imprimir</button>
            </div>
        </div>

        <!-- TABLA DE PRODUCTOS VENDIDOS -->
        <div class="table-card">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th style="min-width:100px;">Fecha</th>
                            <th style="text-align:center; width:70px;">Clave</th>
                            <th style="min-width:120px;">Descripción</th>
                            <th style="text-align:center; width:80px;">Cantidad</th>
                            <th style="text-align:right; width:100px;">Venta</th>
                            <th style="text-align:right; width:90px;">Precio</th>
                            <th style="text-align:right; width:100px;">Costo</th>
                            <th style="text-align:right; width:100px;">Recuperación</th>
                            <th style="text-align:right; width:100px;">Ganancia</th>
                        </tr>
                    </thead>
                    <tbody id="productos-tbody">
                        <tr>
                            <td colspan="9" class="empty"><i class="fas fa-spinner fa-spin"></i> Cargando productos...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- TOTALES FOOTER -->
        <div class="totals-footer">
            <div class="item">
                <div class="label"><i class="fas fa-shopping-cart"></i> Total Productos</div>
                <div class="value primary" id="total-productos">0</div>
            </div>
            <div class="item">
                <div class="label"><i class="fas fa-money-bill-wave"></i> Total Ventas</div>
                <div class="value success" id="total-ventas">C$0.00</div>
            </div>
            <div class="item">
                <div class="label"><i class="fas fa-coins"></i> Ganancia Total</div>
                <div class="value success" id="total-ganancia">C$0.00</div>
            </div>
        </div>
    </div>

    <script src="js/reporte_productos_vendidos.js"></script>
</body>

</html>
